# 复制为可执行文件同目录下的 config/config.yaml。
# 首次启动加 -admin-setup，在 WebUI 设置管理令牌、Bot 密钥和路由。
listen: "127.0.0.1:6700"
log_level: info

storage:
  sqlite: "../data/hashinex.sqlite"
logging:
  file: "../data/hashinex.jsonl"

inputs: []
outputs: []
routes: []

