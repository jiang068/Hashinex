# 复制为可执行文件同目录下的 config/config.yaml。
# 首次启动加 -admin-setup，在 WebUI 设置管理令牌、Bot 密钥和路由。
listen: "127.0.0.1:6700"
log_level: info

storage:
  sqlite: "../data/hashinex.sqlite"
logging:
  file: "../data/hashinex.jsonl"

limits:
  frame_bytes: 1048576
  gscore_frame_bytes: 16777216

# 临时分享仅在启用后启动独立 HTTP 监听。
tempfiles:
  enabled: false
  listen: "127.0.0.1:6701"
  public_url: ""
  directory: "../data/tempfiles"
  max_bytes: 536870912
  ttl: 10m

inputs: []
outputs: []
routes: []

